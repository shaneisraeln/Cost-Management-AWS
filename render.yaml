# Render blueprint for the Cloud Cost Control backend.
#
# Deploys the FastAPI API and a managed PostgreSQL database. The Next.js
# frontend is deployed separately on Vercel (see README).
#
# NOTE (free tier): Render's free plan does not support "worker" services and
# limits you to one free Key Value (Redis) instance per account. Redis is only
# needed by the optional Celery background worker, so it is omitted here — the
# API runs syncs synchronously from the UI and does not require Redis. To add
# background jobs, upgrade the plan, provision a Redis/Key Value instance, set
# REDIS_URL, and add the worker service (commented at the bottom of this file).
#
# After the first deploy, set the "sync: false" secrets in the Render dashboard
# (Environment tab): Clerk keys, Groq key, and the AWS AssumeRole values.
# Nothing secret is committed to git.

databases:
  - name: ccc-postgres
    databaseName: ccc
    user: ccc
    plan: free

services:
  # --- FastAPI backend ---
  - type: web
    name: ccc-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -e .
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      # SQLAlchemy async driver. Render's connectionString is a standard
      # postgres URL; the app expects the asyncpg driver, so we set it
      # explicitly from the DB below (adjust the scheme after copying).
      - key: DATABASE_URL
        fromDatabase:
          name: ccc-postgres
          property: connectionString
      # Deployed frontend origin(s), comma-separated. Update to your Vercel URL
      # after the frontend is deployed, then this service redeploys.
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:3000
      # Clerk (REQUIRED — paste from your Clerk dashboard on first deploy).
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_JWKS_URL
        sync: false
      - key: CLERK_ISSUER
        sync: false
      # Groq (optional — templated fallback works without it). Leave empty or
      # paste a real key later.
      - key: GROQ_API_KEY
        value: ""
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      # AWS cross-account AssumeRole (optional until you enable customer
      # connections). Defaults are harmless placeholders; the app degrades
      # gracefully. Replace with real values to allow AssumeRole connections.
      - key: APP_AWS_PRINCIPAL_ARN
        value: ""
      - key: EXTERNAL_ID_SECRET
        value: change-me-in-dashboard
      - key: AWS_ACCESS_KEY_ID
        value: ""
      - key: AWS_SECRET_ACCESS_KEY
        value: ""
      - key: AWS_REGION
        value: us-east-1

